name: e2e-firestore

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-firestore
  cancel-in-progress: true

# Emulator tier: every job runs under `firebase emulators:exec`, so no live
# project credentials are needed.
#
# The only product with a wasm job (its example ships web/wasm_index.html) and
# the only one whose iOS build needs the extra disk cleanup.
#
# Thin caller: one job per platform this product supports, each delegating
# to the matching `reusable_e2e_<platform>.yaml`. Platforms the product does
# not support have no job here, so they render no check at all.
# Path-filtered so it only runs when this product or its dependencies change;
# the nightly workflow_call still runs it unconditionally.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/cloud_firestore/**'
      - 'packages/firebase_core/**'
      - '.github/workflows/e2e_tests_firestore.yaml'
      - '.github/workflows/reusable_e2e_*.yaml'
      - '.github/actions/setup-flutterfire/**'
      - '.github/workflows/scripts/**'
  push:
    branches:
      - main
    paths:
      - 'packages/cloud_firestore/**'
      - 'packages/firebase_core/**'
      - '.github/workflows/e2e_tests_firestore.yaml'
      - '.github/workflows/reusable_e2e_*.yaml'
      - '.github/actions/setup-flutterfire/**'
      - '.github/workflows/scripts/**'
  workflow_call:
    inputs:
      nightly_test_mode:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/reusable_e2e_changes.yaml
    with:
      package-path: 'packages/cloud_firestore/cloud_firestore'
      platform-interface-package: 'cloud_firestore_platform_interface'
      web-package: 'cloud_firestore_web'

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/reusable_e2e_ios.yaml
    with:
      package-path: 'packages/cloud_firestore/cloud_firestore'
      package-scope: 'cloud_firestore*'
      cache-key-suffix: 'firestore-rc-cocoapods'
      # omg/105320 RC validation: build with CocoaPods against the 12.19.3 pods.
      ios-spm: false
      native-config-args: '--firestore-native'
      nightly_test_mode: ${{ inputs.nightly_test_mode == true }}
